name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build main project
        run: dotnet build MarktplaatsNotifier.csproj -c Release

      - name: Run automated test suite
        run: dotnet run --project tests/MarktplaatsNotifier.Tests/MarktplaatsNotifier.Tests.csproj -c Release

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - rid: win-x64
            name: MarktplaatsNotifier-windows-x64.zip
          - rid: linux-x64
            name: MarktplaatsNotifier-linux-x64.zip
          - rid: linux-arm64
            name: MarktplaatsNotifier-linux-arm64-pi.zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish MarktplaatsNotifier.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/${{ matrix.rid }}

      - name: Package zip
        run: |
          cd dist/${{ matrix.rid }}
          zip -r ../../${{ matrix.name }} .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
