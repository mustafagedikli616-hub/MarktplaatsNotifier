services:
  marktplaats-notifier:
    build: .
    container_name: marktplaats-notifier
    restart: unless-stopped
    ports:
      # Bind to localhost only by default; keep port 5050 closed in cloud firewalls (e.g. Azure NSG)
      - "127.0.0.1:5050:5050"
    environment:
      - TZ=Europe/Amsterdam
      - MARKTPLAATS_DATA_DIR=/data
      - WEB_PORT=5050
      # Required to expose the web UI beyond localhost (also set a strong password before deploying!)
      # - WEB_PASSWORD=change-me-to-a-strong-password
      # Option A: fill these in for zero-file headless setup
      # - TELEGRAM_BOT_TOKEN=123456789:ABCdef...
      # - TELEGRAM_CHAT_ID=123456789
      # - MARKTPLAATS_POSTCODE=1234AB
      # - MARKTPLAATS_PICKUP_KM=10
      # Option B: leave them commented out and place secrets.txt + searches.txt inside ./data/
    volumes:
      - ./data:/data
